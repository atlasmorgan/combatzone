name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: bret
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/docker-web/sites/combatzone
            git pull origin main
            cd ~/docker-web
            docker compose up -d --build combatzone
