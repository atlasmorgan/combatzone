<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Combat Zone - Welcome to the Lobby</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase compat SDK (CDN — no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey:            'AIzaSyA3zs6pQzkwDaXDl5GIe-xyQLC-PBcdf6g',
      authDomain:        'combatzone-2d306.firebaseapp.com',
      projectId:         'combatzone-2d306',
      storageBucket:     'combatzone-2d306.firebasestorage.app',
      messagingSenderId: '1095988180425',
      appId:             '1:1095988180425:web:e794e771d88350efd5e418',
    };
    firebase.initializeApp(firebaseConfig);
    const db   = firebase.firestore();
    const auth = firebase.auth();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow-x: hidden; overflow-y: auto; }

    #intro-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      animation: introFadeIn 0.6s ease-out 0.1s forwards;
      pointer-events: all;
    }
    #intro-overlay.fade-out {
      animation: introFadeOut 0.5s ease-in forwards;
      pointer-events: none;
    }
    #intro-overlay img {
      width: min(340px, 80vw);
    }
    @keyframes introFadeIn  { to   { opacity: 1; } }
    @keyframes introFadeOut { to   { opacity: 0; } }
  </style>
</head>
<body class="min-h-screen bg-gray-950 flex flex-col items-center justify-start sm:justify-center px-4 py-10 sm:p-6">

  <!-- ── FLAME GAMES INTRO ─────────────────────────────────────── -->
  <div id="intro-overlay">
    <img src="assets/flame-games-logo.png" alt="Flame Games" />
  </div>
  <audio id="intro-audio" src="assets/intro.wav" preload="auto"></audio>
  <script>
    (function () {
      const overlay = document.getElementById('intro-overlay');
      const audio   = document.getElementById('intro-audio');

      // Play audio (best-effort; browsers may block until interaction)
      audio.play().catch(() => {});

      // Hold logo for ~1.8s then fade out and remove
      setTimeout(() => {
        overlay.classList.add('fade-out');
        overlay.addEventListener('animationend', () => overlay.remove(), { once: true });
      }, 1800);
    })();
  </script>

  <!-- ── TITLE ─────────────────────────────────────────────────── -->
  <h1 class="text-yellow-400 font-black text-2xl sm:text-4xl tracking-[0.12em] sm:tracking-[0.3em] uppercase mb-1 text-center w-full">
    ☠ COMBAT ZONE
  </h1>
  <p class="text-gray-500 font-mono text-xs sm:text-sm tracking-widest mb-8 sm:mb-10 text-center">
    Multiplayer Tank Arena
  </p>

  <!-- ── NAME INPUT ──────────────────────────────────────────────── -->
  <div class="flex flex-col items-center gap-1 mb-6 w-full max-w-xs">
    <label class="text-gray-500 font-mono text-xs tracking-[0.2em] uppercase self-start">
      Your Name
    </label>
    <input
      id="nameInput"
      type="text"
      maxlength="20"
      placeholder="Player"
      class="w-full bg-gray-900 border border-gray-700 focus:border-yellow-500
             text-yellow-300 font-mono text-sm tracking-wider
             px-4 py-2 outline-none transition-colors"
    />
  </div>

  <!-- ── HOST BUTTON ───────────────────────────────────────────── -->
  <button
    id="hostBtn"
    class="bg-yellow-400 hover:bg-yellow-300 active:bg-yellow-500
           text-gray-950 font-black text-lg tracking-widest
           w-full max-w-xs sm:w-auto px-10 py-4 rounded mb-4 transition-colors select-none"
    onclick="hostRoom()"
  >
    ▶ HOST A NEW ROOM
  </button>

  <!-- ── BATTLE SHOP BUTTON ───────────────────────────────────────── -->
  <button
    onclick="openShop()"
    class="bg-gray-800 hover:bg-gray-700 active:bg-gray-900
           border border-yellow-600 hover:border-yellow-400
           text-yellow-400 font-black text-sm tracking-widest
           w-full max-w-xs sm:w-auto px-8 py-3 rounded mb-6 transition-colors select-none"
  >
    ⚔ BATTLE SHOP
  </button>

  <!-- ── BATTLE SHOP MODAL ─────────────────────────────────────────── -->
  <div id="shopOverlay" style="display:none"
    class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-yellow-700 rounded w-full max-w-lg">

      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
        <span class="text-yellow-400 font-black text-lg tracking-[0.2em] uppercase">⚔ Battle Shop</span>
        <button onclick="closeShop()"
          class="text-gray-500 hover:text-yellow-400 font-mono text-xs tracking-widest transition-colors">
          ✕ CLOSE
        </button>
      </div>

      <!-- Balance -->
      <div class="px-6 py-3 border-b border-gray-800 flex items-center gap-2">
        <span class="text-gray-500 font-mono text-xs uppercase tracking-widest">Balance</span>
        <span id="shopBucks" class="text-yellow-400 font-black text-lg ml-auto flex items-center gap-2">
          <img src="assets/bb-icon.svg" class="w-7 h-7" alt="BB"/> 0
        </span>
      </div>

      <!-- Weapons section -->
      <div class="px-6 pt-4 pb-4">
        <p class="text-gray-500 font-mono text-xs tracking-[0.2em] uppercase mb-3">Weapons</p>
        <div id="shopWeaponGrid" class="grid grid-cols-3 gap-3"></div>
      </div>
    </div>
  </div>

  <!-- ── ACTIVE ROOMS ──────────────────────────────────────────── -->
  <div class="w-full max-w-lg">
    <p class="text-gray-400 font-mono text-xs tracking-[0.25em] uppercase mb-3 border-b border-gray-800 pb-2">
      ACTIVE ROOMS
    </p>

    <!-- Room list — populated by JS -->
    <div id="roomList" class="flex flex-col gap-2">
      <p class="text-gray-600 font-mono text-xs">Loading…</p>
    </div>
  </div>

  <!-- ── CONTROLS HINT ─────────────────────────────────────────── -->
  <p class="text-gray-700 font-mono text-xs tracking-wider mt-8 text-center leading-relaxed">
    WASD — move &nbsp;|&nbsp; Mouse — aim<br class="sm:hidden"/>
    &nbsp;|&nbsp; Click / Space — fire &nbsp;|&nbsp; R — reload
  </p>

  <!-- ── CAREER STATS ─────────────────────────────────────────── -->
  <div class="w-full max-w-xs mt-8">
    <p class="text-gray-500 font-mono text-xs tracking-[0.2em] uppercase mb-2 border-b border-gray-800 pb-2">
      YOUR CAREER STATS
    </p>
    <div class="grid grid-cols-2 gap-x-4 gap-y-1 font-mono text-xs">
      <span class="text-gray-500">Total Kills</span>
      <span id="statKills"   class="text-green-400  text-right">0</span>
      <span class="text-gray-500">Total Deaths</span>
      <span id="statDeaths"  class="text-red-400    text-right">0</span>
      <span class="text-gray-500">Games Played</span>
      <span id="statGames"   class="text-yellow-400 text-right">0</span>
      <span class="text-gray-500">Best Streak</span>
      <span id="statStreak"  class="text-orange-400 text-right">0</span>
      <span class="text-gray-500">Battle Bucks</span>
      <span id="statBucks" class="text-yellow-400 text-right flex items-center justify-end gap-1">
        <img src="assets/bb-icon.svg" class="inline w-4 h-4" alt="BB"/> 0
      </span>
    </div>
  </div>

<script>
// ── Career stats helpers ──────────────────────────────────────────
function loadStats() {
  const defaults = { uid: null, totalKills: 0, totalDeaths: 0, gamesPlayed: 0, bestKillStreak: 0, battleBucks: 0, ownedGuns: ['ar'] };
  try { return Object.assign(defaults, JSON.parse(localStorage.getItem('czCareerStats') || '{}')); }
  catch { return defaults; }
}
function saveStats(delta) {
  localStorage.setItem('czCareerStats', JSON.stringify(Object.assign(loadStats(), delta)));
}
function renderStats() {
  const s = loadStats();
  document.getElementById('statKills').textContent   = s.totalKills;
  document.getElementById('statDeaths').textContent  = s.totalDeaths;
  document.getElementById('statGames').textContent   = s.gamesPlayed;
  document.getElementById('statStreak').textContent  = s.bestKillStreak;
  const bucksEl = document.getElementById('statBucks');
  const bucksImg = bucksEl.querySelector('img');
  bucksEl.textContent = s.battleBucks;
  if (bucksImg) bucksEl.prepend(bucksImg);
}
function syncToFirebase(user) {
  if (!user) return;
  const s = loadStats();
  db.collection('players').doc(user.uid).set({
    playerName:     localStorage.getItem('playerName') || 'Player',
    totalKills:     s.totalKills,
    totalDeaths:    s.totalDeaths,
    gamesPlayed:    s.gamesPlayed,
    bestKillStreak: s.bestKillStreak,
    battleBucks:    s.battleBucks,
    ownedGuns:      s.ownedGuns,
    lastSeen:       firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
}

// Show localStorage stats immediately, then merge cloud data when ready
renderStats();
auth.onAuthStateChanged(user => {
  if (!user) { auth.signInAnonymously(); return; }
  saveStats({ uid: user.uid });
  db.collection('players').doc(user.uid).get().then(doc => {
    if (doc.exists) {
      const r = doc.data(), l = loadStats();
      const cloudGuns = Array.isArray(r.ownedGuns) ? r.ownedGuns : [];
      saveStats({
        totalKills:     Math.max(l.totalKills,     r.totalKills     || 0),
        totalDeaths:    Math.max(l.totalDeaths,    r.totalDeaths    || 0),
        gamesPlayed:    Math.max(l.gamesPlayed,    r.gamesPlayed    || 0),
        bestKillStreak: Math.max(l.bestKillStreak, r.bestKillStreak || 0),
        battleBucks:    Math.max(l.battleBucks,    r.battleBucks    || 0),
        ownedGuns:      [...new Set([...l.ownedGuns, ...cloudGuns])],
      });
    }
    renderStats();
    syncToFirebase(user);
  });
});

// ── Battle Shop ───────────────────────────────────────────────────
const SHOP_WEAPONS = [
  { id: 'ar',        name: 'M4A1',          sub: 'Assault Rifle',             cost: 0   },
  { id: 'shotgun',   name: 'Shotgun',        sub: '95/20/5 dmg • close range', cost: 15  },
  { id: 'burst',     name: 'Burst Rifle',    sub: '75 dmg • burst fire',       cost: 25  },
  { id: 'rpg',       name: 'RPG',            sub: '50 dmg • 3 shots',          cost: 30  },
  { id: 'paintball',  name: 'Paintball Gun',    sub: '22 dmg • rainbow shots',        cost: 100, prime: true },
  { id: 'permafrost', name: 'Permafrost Rifle', sub: '14 dmg • burst • ❄ Freeze',    cost: 175, prime: true },
];

function renderShopWeapons() {
  const s    = loadStats();
  const grid = document.getElementById('shopWeaponGrid');
  grid.innerHTML = SHOP_WEAPONS.map(w => {
    const owned = s.ownedGuns.includes(w.id);
    const canBuy = !owned && s.battleBucks >= w.cost;
    const action = owned
      ? `<span class="bg-green-900 text-green-400 font-mono text-xs px-2 py-0.5 rounded tracking-widest mt-auto">✓ OWNED</span>`
      : canBuy
        ? `<button onclick="buyGun('${w.id}',${w.cost})"
             class="bg-yellow-400 hover:bg-yellow-300 text-gray-950 font-black text-xs px-2 py-1 rounded tracking-widest mt-auto transition-colors">
             BUY — ${w.cost} BB
           </button>`
        : `<span class="text-gray-600 font-mono text-xs mt-auto">${w.cost} BB</span>`;
    const primeBadge = w.prime
      ? `<span class="text-yellow-500 font-mono text-xs tracking-widest">★ PRIME</span>`
      : '';
    const nameColor = w.prime ? 'text-yellow-400' : 'text-white';
    const borderColor = w.prime && !owned ? 'border-yellow-700/50' : owned ? 'border-gray-700' : 'border-gray-800';
    return `
      <div class="bg-gray-800 border ${borderColor} rounded p-3 flex flex-col items-center gap-2 ${owned ? '' : 'opacity-70'}">
        ${primeBadge}
        <span class="${nameColor} font-black text-sm tracking-wider">${w.name}</span>
        <span class="text-gray-400 font-mono text-xs text-center">${w.sub}</span>
        ${action}
      </div>`;
  }).join('');
}

const purchaseAudio = new Audio('assets/purchase.mp3');
purchaseAudio.volume = 0.6;

function buyGun(id, cost) {
  const s = loadStats();
  if (s.ownedGuns.includes(id) || s.battleBucks < cost) return;
  purchaseAudio.currentTime = 0;
  purchaseAudio.play().catch(() => {});
  const newBucks = s.battleBucks - cost;
  saveStats({ battleBucks: newBucks, ownedGuns: [...s.ownedGuns, id] });
  syncToFirebase(auth.currentUser);
  renderStats();
  renderShopWeapons();
  const el = document.getElementById('shopBucks');
  const img = el.querySelector('img');
  el.textContent = newBucks;
  if (img) el.prepend(img);
}

function openShop() {
  const el = document.getElementById('shopBucks');
  const img = el.querySelector('img');
  el.textContent = loadStats().battleBucks;
  if (img) el.prepend(img);
  renderShopWeapons();
  document.getElementById('shopOverlay').style.display = 'flex';
}
function closeShop() {
  document.getElementById('shopOverlay').style.display = 'none';
}

// ── Persist name in localStorage ─────────────────────────────────
const nameInput = document.getElementById('nameInput');
nameInput.value = localStorage.getItem('playerName') || '';
nameInput.addEventListener('input', () => {
  localStorage.setItem('playerName', nameInput.value.trim());
});

function getNameParam() {
  const n = nameInput.value.trim();
  return n ? `&name=${encodeURIComponent(n)}` : '';
}

// ── Host a new room ───────────────────────────────────────────────
async function hostRoom() {
  const btn = document.getElementById('hostBtn');
  btn.textContent = 'Creating…';
  btn.disabled = true;

  try {
    const res  = await fetch('api/rooms', { method: 'POST' });
    const data = await res.json();
    location.href = `game?room=${data.id}${getNameParam()}`;
  } catch (err) {
    btn.textContent = '▶ HOST A NEW ROOM';
    btn.disabled = false;
    alert('Could not reach server. Is it running?');
  }
}

// ── Render room list ──────────────────────────────────────────────
function renderRooms(rooms) {
  const container = document.getElementById('roomList');

  if (!rooms) {
    // Fetch failed
    container.innerHTML = `
      <p class="text-red-500 font-mono text-xs">Could not reach server</p>
    `;
    return;
  }

  if (rooms.length === 0) {
    container.innerHTML = `
      <p class="text-gray-600 font-mono text-xs">No active rooms — host one above!</p>
    `;
    return;
  }

  container.innerHTML = rooms.map(room => {
    const isFull  = room.players >= room.maxPlayers;
    const pips    = buildPips(room.players, room.maxPlayers);

    // JOIN button or FULL badge
    const action = isFull
      ? `<span class="bg-red-900 text-red-400 font-mono text-xs px-3 py-1 rounded tracking-widest">FULL</span>`
      : `<button
           onclick="joinRoom('${room.id}')"
           class="bg-green-700 hover:bg-green-600 active:bg-green-800
                  text-white font-mono text-xs px-4 py-1 rounded tracking-widest transition-colors"
         >JOIN</button>`;

    return `
      <div class="flex items-center justify-between
                  bg-gray-900 border border-gray-800 rounded px-4 py-3">
        <!-- Room code -->
        <span class="text-yellow-400 font-mono text-sm tracking-[0.2em] w-20">${room.id}</span>

        <!-- Player pips -->
        <div class="flex items-center gap-1">
          ${pips}
          <span class="text-gray-500 font-mono text-xs ml-2">${room.players}/${room.maxPlayers}</span>
        </div>

        <!-- Action -->
        ${action}
      </div>
    `;
  }).join('');
}

// Build filled / empty pip dots (8 total)
function buildPips(filled, total) {
  let html = '';
  for (let i = 0; i < total; i++) {
    const isOn = i < filled;
    html += `<span class="inline-block w-2.5 h-2.5 rounded-full ${
      isOn ? 'bg-green-500' : 'bg-gray-700'
    }"></span>`;
  }
  return html;
}

// ── Navigate to a room ────────────────────────────────────────────
function joinRoom(id) {
  location.href = `game?room=${id}${getNameParam()}`;
}

// ── Fetch and refresh room list ───────────────────────────────────
async function refreshRooms() {
  try {
    const res   = await fetch('api/rooms');
    const rooms = await res.json();
    renderRooms(rooms);
  } catch {
    renderRooms(null); // show error state
  }
}

// Initial load + auto-refresh every 3 seconds
refreshRooms();
setInterval(refreshRooms, 3000);
</script>
</body>
</html>
