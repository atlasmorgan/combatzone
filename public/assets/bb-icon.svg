<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Drop shadow -->
  <polygon points="32,5 59,32 32,59 5,32" fill="#000" opacity="0.35" transform="translate(2,3)"/>
  <!-- Diamond body -->
  <polygon points="32,5 59,32 32,59 5,32" fill="#facc15"/>
  <!-- Top facet highlight -->
  <polygon points="32,5 45.5,18.5 32,23 18.5,18.5" fill="#fef08a" opacity="0.65"/>
  <!-- Bottom facet shade -->
  <polygon points="32,59 45.5,45.5 32,41 18.5,45.5" fill="#92400e" opacity="0.35"/>
  <!-- Left facet shade -->
  <polygon points="5,32 18.5,18.5 23,32 18.5,45.5" fill="#92400e" opacity="0.2"/>
  <!-- Diamond outline -->
  <polygon points="32,5 59,32 32,59 5,32" fill="none" stroke="#854d0e" stroke-width="1.5"/>

  <!-- Skull head (shifted down ~4px to center in diamond) -->
  <ellipse cx="32" cy="29" rx="13" ry="12" fill="#111827"/>

  <!-- Eye sockets -->
  <circle cx="26.5" cy="27" r="4" fill="#facc15"/>
  <circle cx="37.5" cy="27" r="4" fill="#facc15"/>

  <!-- Nose cavity -->
  <polygon points="32,32 29.5,36.5 34.5,36.5" fill="#facc15"/>

  <!-- Jaw -->
  <rect x="21" y="38" width="22" height="8" rx="2" fill="#111827"/>

  <!-- Teeth -->
  <rect x="22.5" y="38" width="3.5" height="7" rx="0.8" fill="#facc15"/>
  <rect x="28"   y="38" width="3.5" height="7" rx="0.8" fill="#facc15"/>
  <rect x="33.5" y="38" width="3.5" height="7" rx="0.8" fill="#facc15"/>
  <rect x="39"   y="38" width="2.5" height="7" rx="0.8" fill="#facc15"/>
</svg>
